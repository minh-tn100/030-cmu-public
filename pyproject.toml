[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "designbench"
version = "0.1.0"
description = "Research agent that reviews agent-payment designs against OWASP ASI01-ASI10 with verified citations (CMU Agentic AI capstone)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn", "spacy", "mcp<2", "langgraph", "pytest"]

[project.optional-dependencies]
st = ["sentence-transformers"]
claude = ["anthropic"]
ui = ["streamlit"]
skills = ["pyyaml", "langchain-core", "langchain-anthropic"]

[tool.setuptools]
# flat layout: list the code packages explicitly so data/, specs/, skills/ are not mistaken for packages
packages = ["agent", "retrieval", "mcp_server", "eval", "app"]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
